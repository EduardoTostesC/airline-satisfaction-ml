[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-satisfaction-ml"
version = "0.1.0"
description = "Pipeline reproduzível para o Kaggle Playground S6E10"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{name = "Adilson Eduardo Tostes Carmo"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "catboost>=1.2.8,<2",
  "matplotlib>=3.9,<4",
  "psutil>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
boosting = ["lightgbm>=4.7,<5", "xgboost>=3,<4"]
kaggle = ["kaggle>=2,<3"]

[project.scripts]
airline-ml = "airline_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
